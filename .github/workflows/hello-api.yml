name: Hello API CI

on:
  push:
    paths:
      - "hello-api/**"
      - ".github/workflows/hello-api.yml"
  pull_request:
    paths:
      - "hello-api/**"
      - ".github/workflows/hello-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: hello-api/go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: hello-api/go.mod
      - run: go test ./...

  build:
    needs: [vet, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: hello-api/go.mod
      - name: Build Linux x64 binary
        run: GOOS=linux GOARCH=amd64 go build -o hello-api-linux-amd64 ./cmd/hello-api

      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: hello-api-linux-amd64
          path: hello-api/hello-api-linux-amd64
          if-no-files-found: error

      - name: Build macOS Apple-Silicon binary
        run: GOOS=darwin GOARCH=arm64 go build -o hello-api-macos-arm64 ./cmd/hello-api

      - name: Upload macOS Apple-Silicon binary
        uses: actions/upload-artifact@v4
        with:
          name: hello-api-macos-arm64
          path: hello-api/hello-api-macos-arm64
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: hello-api-linux-amd64
          path: artifact

      - name: Start the API and check its health endpoint
        shell: bash
        run: |
          chmod +x artifact/hello-api-linux-amd64
          ./artifact/hello-api-linux-amd64 > hello-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat hello-api.log' EXIT

          for attempt in {1..10}; do
            response="$(curl --fail --silent --show-error http://127.0.0.1:8080/health)" && break
            sleep 1
          done

          test "$response" = '{"status":"ok"}'

      - name: Upload the API log if the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hello-api-smoke-log
          path: hello-api.log
          if-no-files-found: ignore
