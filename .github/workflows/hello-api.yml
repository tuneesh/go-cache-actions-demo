name: Hello API CI

on:
  push:
    paths:
      - "hello-api/**"
      - ".github/workflows/hello-api.yml"
  pull_request:
    paths:
      - "hello-api/**"
      - ".github/workflows/hello-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: hello-api/go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: hello-api/go.mod
      - run: go test ./...

  build:
    needs: [vet, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: hello-api/go.mod
      - run: go build -o hello-api ./cmd/hello-api
      - uses: actions/upload-artifact@v4
        with:
          name: hello-api-linux
          path: hello-api/hello-api