name: Hello API Cache Lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hello-api-cache-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standard-vet:
    name: Standard cache — vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: |
            hello-api/go.mod
            hello-api/go.sum
      - run: go vet ./...

  standard-test:
    name: Standard cache — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: |
            hello-api/go.mod
            hello-api/go.sum
      - name: Test and show elapsed time
        run: time go test -v ./...

  standard-build:
    name: Standard cache — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: hello-api/go.mod
          cache: true
          cache-dependency-path: |
            hello-api/go.mod
            hello-api/go.sum
      - run: go build ./cmd/hello-api

  cloudx-vet:
    name: CloudX isolated cache — vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.25.0"
          cache-key-prefix: hello-api-vet
          cache-dependency-path: |
            hello-api/go.mod
            hello-api/go.sum
      - run: go vet ./...

  cloudx-test:
    name: CloudX isolated cache — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.25.0"
          cache-key-prefix: hello-api-test
          cache-dependency-path: |
            hello-api/go.mod
            hello-api/go.sum
      - name: Test and show elapsed time
        run: time go test -v ./...

  cloudx-build:
    name: CloudX isolated cache — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-api
    steps:
      - uses: actions/checkout@v4
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.25.0"
          cache-key-prefix: hello-api-build
          cache-dependency-path: |
            hello-api/go.mod
            hello-api/go.sum
      - run: go build ./cmd/hello-api
