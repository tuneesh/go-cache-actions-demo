name: Compare Go cache strategies

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: go-cache-demo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  default-lint:
    name: Default cache — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: go.mod
      - run: go vet ./...

  default-test:
    name: Default cache — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: go.mod
      - name: Run package tests
        run: |
          time go test -v ./...

  default-build:
    name: Default cache — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: go.mod
      - run: go build ./...

  isolated-lint:
    name: Isolated cache — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.25.0"
          cache-key-prefix: lint
          cache-dependency-path: go.mod
      - run: go vet ./...

  isolated-test:
    name: Isolated cache — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.25.0"
          cache-key-prefix: test
          cache-dependency-path: go.mod
      - name: Run package tests
        run: |
          time go test -v ./...

  isolated-build:
    name: Isolated cache — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.25.0"
          cache-key-prefix: build
          cache-dependency-path: go.mod
      - run: go build ./...

  native-isolated-test:
    name: Native job-isolated cache — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false
      - name: Restore or save a test-only Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: native-go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
          restore-keys: |
            native-go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-
      - name: Run package tests
        run: |
          time go test -v ./...
